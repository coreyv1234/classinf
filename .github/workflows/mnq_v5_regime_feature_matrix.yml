name: MNQ V5 Regime Feature Matrix

on:
  push:
    branches:
      - mnq-v5-regime-router-20260907
  workflow_dispatch:

jobs:
  annotate-year:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        year: [2020, 2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check numpy pandas
      - name: Restore frozen V3 engine
        run: |
          gunzip -c scratch/mnq_v42/SOVEREIGN_MNQ_V2_NO_PD_RESEARCH.py.gz > SOVEREIGN_MNQ_V2_NO_PD_RESEARCH.py
          gunzip -c scratch/mnq_v42/SOVEREIGN_MNQ_V3_BIG_R_GRADED_RESEARCH.py.gz > SOVEREIGN_MNQ_V3_BIG_R_GRADED_RESEARCH.py
      - name: Sparse checkout MNQ Last files
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/mbytes21/MNQ_DATA.git MNQ_DATA
          cd MNQ_DATA
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone 'plaintext_csv/*/*.Last.csv'
          git checkout main
      - name: Build causal target-year bars with warmup
        env:
          YEAR: ${{ matrix.year }}
        run: |
          PREV=$((YEAR-1))
          python scratch/mnq_v42/stitch_mnq_multiyear.py MNQ_DATA --start "$PREV-12-01" --end "$YEAR-12-31 23:59:59" --out STITCH_$YEAR >/dev/null
      - name: Run frozen V3 candidates
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python SOVEREIGN_MNQ_V3_BIG_R_GRADED_RESEARCH.py STITCH_$YEAR/MNQ_5m_2019_2025.csv --source-tz UTC --input-minutes 5 --out V3_$YEAR >/dev/null
      - name: Annotate candidate trades with causal market regime
        env:
          YEAR: ${{ matrix.year }}
        run: |
          python scratch/mnq_v42/annotate_mnq_regime.py STITCH_$YEAR/MNQ_5m_2019_2025.csv V3_$YEAR/trades.csv --year $YEAR --out REGIME_$YEAR/annotated_trades.csv
          python - <<'PY'
          import os,pandas as pd
          y=int(os.environ['YEAR'])
          d=pd.read_csv(f'REGIME_{y}/annotated_trades.csv')
          rc=[c for c in d.columns if c.startswith('r_')]
          print('REGIME_RESULT',y,'rows',len(d),'features',len(rc),'mean_feature_missing',round(float(d[rc].isna().mean().mean()),4))
          print(d.groupby('family').size().to_dict())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mnq-v5-regime-${{ matrix.year }}
          path: |
            REGIME_${{ matrix.year }}/annotated_trades.csv
            STITCH_${{ matrix.year }}/coverage.json
